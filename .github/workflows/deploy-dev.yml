name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Export OpenAPI Specification
        run: |
          mkdir -p docs
          php artisan scramble:export --path=docs/openapi.json
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Setup Swagger UI
        run: |
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.10.5.tar.gz -o swagger-ui.tar.gz
          tar -xzf swagger-ui.tar.gz
          cp -r swagger-ui-*/dist/* docs/
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi.json|g' docs/swagger-initializer.js

      - name: Deploy application to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./"
          target: "/var/www/dev/api"
          rm: true
          overwrite: true
          strip_components: 0
          excludes: |
            .git,
            .github,
            _ide_helper*.php,
            .phpstorm.meta.php,
            .editorconfig,
            .env,
            .env.example,
            node_modules,
            tests,
            storage/logs/*,
            .gitignore,
            .gitattributes

      - name: Run migrations and optimize
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/dev/api
            php artisan migrate
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Deploy Swagger documentation
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docs/*"
          target: "/var/www/dev/swagger"
          strip_components: 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Déploiement DEV réussi - $(git rev-parse --short HEAD)"
