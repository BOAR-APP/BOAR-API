name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Generate OpenAPI specification
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p docs
          php artisan scramble:export --path=docs/openapi.json
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Setup Swagger UI
        run: |
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.10.5.tar.gz -o swagger-ui.tar.gz
          tar -xzf swagger-ui.tar.gz
          cp -r swagger-ui-*/dist/* docs/
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi.json|g' docs/swagger-initializer.js

      - name: Deploy application to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='_ide_helper*.php' --exclude='.env' --exclude='node_modules' --exclude='tests' --exclude='storage/logs/*' --exclude='docs'
          path: ./
          remote_path: /var/www/${{ secrets.DEPLOY_VPS_DIR }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Swagger documentation
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: docs/
          remote_path: /var/www/dev/swagger/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run post-deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/${{ secrets.DEPLOY_VPS_DIR }}
            php artisan migrate
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
