name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Generate OpenAPI specification
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p docs
          php artisan scramble:export --path=docs/openapi.json
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Setup Swagger UI
        run: |
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.10.5.tar.gz -o swagger-ui.tar.gz
          tar -xzf swagger-ui.tar.gz
          cp -r swagger-ui-*/dist/* docs/
          sed -i 's|https://petstore.swagger.io/v2/swagger.json|./openapi.json|g' docs/swagger-initializer.js

      - name: Create backup on VPS before deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Créer un backup timestampé
            BACKUP_DIR="/var/www/dev/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p $BACKUP_DIR

            # Backup du code actuel
            if [ -d "/var/www/${{ secrets.DEPLOY_VPS_DIR }}" ]; then
              tar -czf $BACKUP_DIR/api_backup_$TIMESTAMP.tar.gz -C /var/www/${{ secrets.DEPLOY_VPS_DIR }} .
              echo "Backup créé: api_backup_$TIMESTAMP.tar.gz"

              # Garder seulement les 5 derniers backups
              cd $BACKUP_DIR
              ls -t api_backup_*.tar.gz | tail -n +6 | xargs -r rm
            fi

      - name: Deploy application to VPS
        id: deploy_app
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git' --exclude='.github' --exclude='_ide_helper*.php' --exclude='.env' --exclude='.env.example' --exclude='node_modules' --exclude='tests' --exclude='storage/logs/*' --exclude='docs'
          path: ./
          remote_path: /var/www/${{ secrets.DEPLOY_VPS_DIR }}/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Swagger documentation
        id: deploy_swagger
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: docs/
          remote_path: /var/www/dev/swagger/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run post-deployment commands
        id: post_deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/${{ secrets.DEPLOY_VPS_DIR }}

            # Vérifier que .env existe
            if [ ! -f .env ]; then
              echo "ERREUR: .env manquant"
              exit 1
            fi

            # Migrations et optimisations
            php artisan migrate || exit 1
            php artisan optimize:clear || exit 1
            php artisan config:cache || exit 1
            php artisan route:cache || exit 1

            echo "Déploiement réussi - $(date)"

      - name: Notify success
        if: success()
        run: |
          echo "Déploiement DEV réussi"
          echo "Commit: ${{ github.sha }}"
          echo "Auteur: ${{ github.actor }}"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Échec du déploiement, restauration en cours..."

            BACKUP_DIR="/var/www/dev/backups"
            LATEST_BACKUP=$(ls -t $BACKUP_DIR/api_backup_*.tar.gz 2>/dev/null | head -n 1)

            if [ -f "$LATEST_BACKUP" ]; then
              echo "Restauration depuis: $LATEST_BACKUP"

              # Sauvegarder l'état cassé pour debug
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              tar -czf $BACKUP_DIR/failed_deploy_$TIMESTAMP.tar.gz -C /var/www/${{ secrets.DEPLOY_VPS_DIR }} .

              # Restaurer le backup
              cd /var/www/${{ secrets.DEPLOY_VPS_DIR }}
              tar -xzf $LATEST_BACKUP

              # Reconstruire les caches
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache

              echo "Rollback terminé"
            else
              echo "Aucun backup trouvé, impossible de restaurer"
            fi

      - name: Notify failure
        if: failure()
        run: |
          echo "Déploiement DEV échoué"
          echo "Commit: ${{ github.sha }}"
          echo "Rollback effectué automatiquement"
