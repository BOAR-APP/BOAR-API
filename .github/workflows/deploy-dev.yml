name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Pour détecter les changements

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      #- name: Run Tests
      #  run: composer test
      #  env:
      #    DB_CONNECTION: sqlite
      #    DB_DATABASE: ':memory:'

      - name: Export OpenAPI for Dev
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p openapi
          php artisan scramble:export --path=openapi/openapi.json

      - name: Detect changes
        id: changes
        run: |
          echo "Déploiement de $(git rev-parse --short HEAD)"
          prev="${{ github.event.before }}"
          if [ "$prev" = "0000000000000000000000000000000000000000" ]; then
            prev="HEAD~1"
          fi

          composer_changed=$(git diff --name-only $prev HEAD -- composer.json composer.lock | wc -l)
          env_changed=$(git diff --name-only $prev HEAD -- .env.example | wc -l)

          echo "composer_changed=$composer_changed" >> $GITHUB_OUTPUT
          echo "env_changed=$env_changed" >> $GITHUB_OUTPUT

          echo "Files changed since $prev:"
          git log --oneline --name-only $prev..HEAD

      - name: Deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./*"
          target: "/var/www/dev/api"
          rm: false
          overwrite: true
          strip_components: 0

      - name: Setup and migrate on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/dev/api

            # Copier .env si changé ou inexistant
            if [ ! -f .env ] || [ "${{ steps.changes.outputs.env_changed }}" != "0" ]; then
              cp .env.example .env
              php artisan key:generate
            fi

            # Créer la base SQLite si besoin
            touch database/database.sqlite

            # Installer les dépendances si composer.json a changé
            if [ "${{ steps.changes.outputs.composer_changed }}" != "0" ] || [ ! -d vendor ]; then
              composer install --no-dev --optimize-autoloader
            fi

            # Migrations et cache
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Permissions
            chmod -R 775 storage bootstrap/cache
            chown -R deploy:www-data /var/www/dev/api

      - name: Deploy Swagger UI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "openapi/*"
          target: "/var/www/dev/swagger"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Déploiement réussi de $(git rev-parse --short HEAD) en DEV"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "❌ Échec du déploiement, restauration nécessaire"
            # Ici tu peux ajouter une logique de rollback si besoin
